<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SyncMark</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>SyncMark</h1>
        <p>Gestionnaire de workspaces</p>
    </div>

    <div class="connection-status">
        <span id="connectionDot" class="status-dot disconnected"></span>
        <span id="connectionText">Vérification...</span>
    </div>

    <div class="workspace-section">
        <label for="workspaceSelect">Workspace actif</label>
        <div class="workspace-current">
            <span id="workspaceName" class="workspace-name">Aucun</span>
            <span id="workspaceColor" class="workspace-color"></span>
        </div>
        <select id="workspaceSelect" disabled>
            <option value="">Chargement...</option>
        </select>
    </div>

    <div class="actions">
        <button id="syncBtn">
            <span id="btnText">Synchroniser</span>
            <div id="loader" class="loader hidden"></div>
        </button>
    </div>

    <div id="status">
        Prêt à synchroniser.
    </div>

    <script src="popup.js"></script>
</body>
</html>
